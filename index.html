<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Studio</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#18343b;font:16px system-ui,sans-serif}header{background:#143d42;color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px}small{color:#67828a}header small{color:#b4d8d5}main{max-width:1100px;margin:36px auto;padding:0 20px}section{background:white;border:1px solid #dce6e7;border-radius:18px;padding:24px;margin-bottom:20px}button{border:0;border-radius:9px;padding:12px 18px;background:#167c72;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#e4efee;color:#174e4a}input,textarea,select{width:100%;font:inherit;border:1px solid #bdcdd0;border-radius:8px;padding:12px;margin:6px 0 14px;background:white}textarea{min-height:150px}label{font-weight:600}#status{white-space:pre-wrap}#projects button{display:block;width:100%;text-align:left;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}footer{padding:20px;text-align:center;color:#67828a}a{color:#167c72}
</style><header><div><h1>Lesson Studio</h1><small>영쌤클래스 · 수업 제작 스튜디오 · v0.2 기반 테스트</small></div><nav><button id="login">Google 계정 연결</button><button id="logout" class="secondary" disabled>연결 해제</button></nav></header><main><section><h2>나의 수업 작업실</h2><p id="status" role="status">Google 계정을 연결하면 개인 Drive에 프로젝트를 저장할 수 있습니다.</p><button id="reload" class="secondary" disabled>Drive 프로젝트 새로고침</button> <a id="folder" hidden target="_blank" rel="noopener">내 Drive 폴더 열기</a><div id="projects"></div></section><section><h2>차시 프로젝트</h2><label for="title">프로젝트 이름</label><input id="title" placeholder="예: 기후변화와 우리의 책임"><div class="grid"><div><label for="grade">학교급 / 학년</label><input id="grade" placeholder="초등 4학년"></div><div><label for="subject">교과 / 과목</label><input id="subject" placeholder="과학"></div></div><label for="plan">기존 수업 설계 및 차시 내용</label><textarea id="plan"></textarea><nav><button id="save" disabled>Drive에 저장</button><button id="fresh" class="secondary">새 프로젝트</button><button id="download" class="secondary">JSON 다운로드</button></nav></section><section><h2>교육과정 연동</h2><p>공통 성취기준 원본은 관리자 읽기 전용 제공 경로를 연결한 뒤 사용할 수 있습니다. 현재는 개인 Drive 인증 및 저장 테스트 단계입니다.</p><p>AI 자료 생성 및 PPTX·DOCX 출력은 후속 구현 대상입니다.</p></section></main><footer>개인 프로젝트는 연결한 Google Drive에 저장됩니다. <a href="privacy.html">개인정보 안내</a></footer><script>
'use strict';
const CLIENT='874381452451-gips8mhgik48giv89taqunqhtv1q3qi6.apps.googleusercontent.com', SCOPE='https://www.googleapis.com/auth/drive.file', $=id=>document.getElementById(id);
let token='', root='', fileId='', revision='', busy=false, dirty=false, timer=null;
const fields=['title','grade','subject','plan'];
function status(s){$('status').textContent=s}
function controls(){for(const id of ['save','reload','logout'])$(id).disabled=!token||busy;$('login').disabled=busy}
function snapshot(){return Object.fromEntries(fields.map(k=>[k,$(k).value]))}
function clearEditor(){fields.forEach(k=>$(k).value='');fileId='';revision='';dirty=false}
function disconnect(){token='';root='';fileId='';revision='';clearEditor();$('projects').replaceChildren();$('folder').hidden=true;clearTimeout(timer);controls()}
async function api(path,options={}){const r=await fetch('https://www.googleapis.com'+path,{...options,headers:{...options.headers,Authorization:'Bearer '+token}});if(r.status===401){disconnect();throw Error('인증이 만료되었습니다. 다시 연결하세요.')}if(!r.ok)throw Error('Google Drive 오류 '+r.status);return r.status===204?null:r.json()}
async function list(q){let files=[],pageToken;do{const p=new URLSearchParams({q,fields:'nextPageToken,files(id,name,modifiedTime,version)',pageSize:'100'});if(pageToken)p.set('pageToken',pageToken);const r=await api('/drive/v3/files?'+p);files.push(...r.files);pageToken=r.nextPageToken}while(pageToken);return files}
async function connect(){if(!window.google?.accounts?.oauth2){status('인증 모듈 로딩 중입니다. 잠시 후 다시 눌러 주세요.');return}google.accounts.oauth2.initTokenClient({client_id:CLIENT,scope:SCOPE,callback:async r=>{if(r.error){status('인증 오류: '+r.error);return}token=r.access_token;busy=true;controls();try{const folders=await list("trashed = false and mimeType = 'application/vnd.google-apps.folder' and appProperties has { key='lessonStudioRoot' and value='1' }");root=folders[0]?.id;if(!root){const f=await api('/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Lesson Studio',mimeType:'application/vnd.google-apps.folder',appProperties:{lessonStudioRoot:'1'}})});root=f.id}$('folder').href='https://drive.google.com/drive/folders/'+root;$('folder').hidden=false;await refresh();status('Google Drive 연결 완료. 개인 프로젝트를 저장할 수 있습니다.')}catch(e){status(e.message)}finally{busy=false;controls()}}}).requestAccessToken({prompt:'select_account'})}
async function refresh(){const files=await list("'"+root+"' in parents and trashed = false and appProperties has { key='lessonStudioProject' and value='1' }");$('projects').replaceChildren();for(const f of files){const b=document.createElement('button');b.className='secondary';b.textContent=f.name+' · '+f.modifiedTime.slice(0,10);b.onclick=()=>load(f);$('projects').append(b)}}
async function load(f){if(dirty&&!confirm('저장하지 않은 변경사항을 버릴까요?'))return;clearTimeout(timer);busy=true;controls();try{const data=await api('/drive/v3/files/'+f.id+'?alt=media');const meta=await api('/drive/v3/files/'+f.id+'?fields=version');fields.forEach(k=>$(k).value=String(data[k]??''));fileId=f.id;revision=meta.version;dirty=false;status('프로젝트 불러오기 완료')}catch(e){status(e.message)}finally{busy=false;controls()}}
async function save(){if(busy||!token||!root)return;if(!$('title').value.trim()){status('프로젝트 이름을 입력하세요.');return}clearTimeout(timer);busy=true;controls();const data={...snapshot(),schemaVersion:1,updatedAt:new Date().toISOString()};try{if(fileId){const meta=await api('/drive/v3/files/'+fileId+'?fields=version');if(meta.version!==revision)throw Error('다른 기기에서 수정된 프로젝트입니다. 변경 내용을 JSON으로 다운로드한 뒤 다시 불러오세요.')}const boundary='lessonstudio'+crypto.randomUUID(),meta={name:data.title+'.json',mimeType:'application/json',appProperties:{lessonStudioProject:'1'},...(!fileId?{parents:[root]}:{})};const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n--'+boundary+'--';const f=await api('/upload/drive/v3/files'+(fileId?'/'+fileId:'')+'?uploadType=multipart&fields=id,version',{method:fileId?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});fileId=f.id;revision=f.version;dirty=fields.some(k=>$(k).value!==data[k]);await refresh();status('Drive 저장 완료 · '+new Date().toLocaleTimeString('ko-KR'))}catch(e){status(e.message)}finally{busy=false;controls()}}
$('login').onclick=()=>{if(dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 계정을 전환할까요?'))return;disconnect();connect()};$('logout').onclick=()=>{if(dirty&&!confirm('저장하지 않은 변경사항을 버릴까요?'))return;const t=token;disconnect();google.accounts.oauth2.revoke(t,()=>{});status('Google Drive 연결 해제')};$('reload').onclick=async()=>{try{await refresh();status('목록 갱신 완료')}catch(e){status(e.message)}};$('save').onclick=save;$('fresh').onclick=()=>{if(dirty&&!confirm('저장하지 않은 변경사항을 버릴까요?'))return;clearTimeout(timer);clearEditor();status('새 프로젝트')};$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=($('title').value||'lesson')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};fields.forEach(k=>$(k).addEventListener('input',()=>{dirty=true;clearTimeout(timer);if(fileId&&token)timer=setTimeout(save,2000)}));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});controls();
</script></html>
